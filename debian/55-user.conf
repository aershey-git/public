<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Provide required aliases for standard names -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Georgia Pro</family>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
      <family>Nimbus Roman</family>
      <family>DejaVu Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Verdana Pro</family>
      <family>Helvetica Now Text</family>
      <family>Arial Nova</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>sans</family>
    <prefer>
      <family>Verdana Pro</family>
      <family>Helvetica Now Text</family>
      <family>Arial Nova</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Cascadia Code</family>
      <family>Courier Prime</family>
      <family>Liberation Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>cursive</family>
    <prefer>
      <family>French Script MT</family>
      <family>URW Chancery L</family>
      <family>Comic Neue</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
      <family>Segoe UI Emoji</family>
    </prefer>
  </alias>

    <alias>
    <family>fantasy</family>
    <prefer>
      <family>Papyrus</family>
      <family>URW Bookman</family>
    </prefer>
  </alias>

  <!-- Standard Substitutions -->

    <match target="pattern">
        <test name="family" qual="any">
            <string>Verdana</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Verdana Pro</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Georgia</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Georgia Pro</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Arial</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Arial Nova</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Courier New</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Courier Prime</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Courier</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Courier Prime Sans</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Times</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Times New Roman</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Helvetica</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Helvetica Now Text</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Helvetica Neue</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Helvetica Now Text</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Monaco</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Courier Prime Sans</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Menlo</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Courier Prime Sans</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Comic Sans MS</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Comic Neue</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Tinos</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Times New Roman</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Arimo</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Arial Nova</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>Cousine</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Courier Prime Sans</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>caladea</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Cambria</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="any">
            <string>carlito</string>
        </test>
        <edit name="family" mode="assign" binding="same">
            <string>Calibri</string>
        </edit>
    </match>
    
</fontconfig>
